# 锻造增强插件配置
# 稀有词条出现概率 (0-1)
rare-chance: 0.2

# 锻造石材料列表
forging-stones:
  - NETHERITE_UPGRADE_SMITHING_TEMPLATE
  - NETHERITE_SCRAP
  - AMETHYST_SHARD
  - DIAMOND

# 可强化的装备类型后缀
enhanceable-equipment-suffixes:
  - _BOOTS
  - _LEGGINGS
  - _CHESTPLATE
  - _HELMET
  - _SWORD
  - _AXE
  - _PICKAXE
  - _SHOVEL
  - _HOE

# 消息格式
messages:
  lore-format: '§a%s: +%.1f%%'
  display-format: '当前物品的%s: +%.1f%%'

attribute_pool:
  helmet:
    - movement_speed
    - armor
    - armor_toughness
    - gravity
    - burning_time
    - explosion_knockback_resistance
    - knockback_resistance
    - max_health
    - oxygen_bonus

  chestplate:
    - movement_speed
    - armor
    - armor_toughness
    - gravity
    - burning_time
    - explosion_knockback_resistance
    - knockback_resistance
    - max_health

  leggings:
    - movement_speed
    - armor
    - armor_toughness
    - gravity
    - burning_time
    - explosion_knockback_resistance
    - knockback_resistance
    - max_health
    - sneaking_speed
    - step_height

  boots:
    - movement_speed
    - armor
    - armor_toughness
    - gravity
    - burning_time
    - explosion_knockback_resistance
    - knockback_resistance
    - max_health
    - fall_damage_multiplier
    - water_movement_efficiency
    - movement_efficiency
    - jump_strength
    - safe_fall_distance

  sword:
    - attack_damage
    - attack_knockback
    - attack_speed
    - entity_interaction_range
    - sweeping_damage_ratio

  axe:
    - attack_damage
    - attack_knockback
    - attack_speed
    - entity_interaction_range
    - mining_efficiency
    - submerged_mining_speed
    - block_interaction_range

  pickaxe:
    - attack_damage
    - attack_knockback
    - attack_speed
    - entity_interaction_range
    - mining_efficiency
    - submerged_mining_speed
    - block_interaction_range

  shovel:
    - attack_damage
    - attack_knockback
    - attack_speed
    - entity_interaction_range
    - mining_efficiency
    - submerged_mining_speed
    - block_interaction_range

  hoe:
    - attack_damage
    - attack_knockback
    - attack_speed
    - entity_interaction_range
    - mining_efficiency
    - submerged_mining_speed
    - block_interaction_range

# 属性配置
attributes:
  movement_speed:
    name: 速度
    operation: MULTIPLY_SCALAR_1
    values:
      BROKEN: {min: 0.01, max: 0.03}
